<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acceso Remoto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/formatos2.css">
</head>
<body>
    <header>
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-6 d-flex justify-content-center">
                <img src="../img/encabe.png" class="img-fluid" alt="logo">
            </div>
        </div>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="#">Agregar Usuario</a>
                        <a class="nav-link" href="#">Autenticar Usuario</a>
                        <a class="nav-link" href="#">Lista de clientes del usuario actual</a>
                        <!--En la lista anterior por cada cliente mostrado, deben aparecer los accesos a los métodos de
                        modificar y borrar el cliente.-->
                        <a class="nav-link" href="#">Agregar clientes al usuario actual</a>
                        <a class="nav-link" href="#">Modificar los datos</a>
                        <!--El método de borrar debe confirmar si desea eliminar el registro del cliente o no.-->
                    </div>
                </div>
            </div>
        </nav>
    </header>
   
    <main>
        <h1>Captura de Datos</h1>
        <form name="formita" enctype="application/x-www-form-urlencoded">
            <fieldset>
                <div class="">
                    <label>Nombre:</label>
                    <input type="text" id="txtNomb" maxlength="15" size="20" required autofocus>
                </div>
                <div class="">
                    <label>eMail:</label>
                    <input type="text" id="txtEmail" maxlength="30" size="35" required>
                </div>
                <div class="">
                    <label>Contraseña:</label>
                    <input type="password" id="txtContra" maxlength="10" size="15" required>
                </div>
            </fieldset>
            <div>
                <!--btGuardar-->
                <a href="#" id="btnGuardar">Guardar</a>
                <a href="#" id="btnMostrar">Mostrar</a>
            </div>
        </form>
    </main>


    <div id="Datos"></div>

    <!--SCRIPT JS BOOTSTRAP-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="codes/codigo_05.js"> </script>
</body>
</html>
