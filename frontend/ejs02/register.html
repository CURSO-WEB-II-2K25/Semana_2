<body>
    <header>
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-6 d-flex justify-content-center">
                <img src="img/encabe.png" class="img-fluid" alt="logo">
            </div>
        </div>
    </header>
   
    <main class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <form name="formita" enctype="application/x-www-form-urlencoded"
        class="p-4 border rounded bg-light"
        style="max-width: 400px; width: 100%; min-height: 400px;">
        <h2 class="mb-4 text-center">Ingresar Usuario</h2>
        <div class="mb-3">
            <label for="txtNomb" class="form-label">Nombre:</label>
            <input type="text" class="form-control" id="txtNomb" maxlength="15" required autofocus>
        </div>
        <div class="mb-3">
            <label for="txtEmail" class="form-label">Correo electrónico:</label>
            <input type="email" class="form-control" id="txtEmail" maxlength="30" required>
        </div>
        <div class="mb-3">
            <label for="txtContra" class="form-label">Contraseña:</label>
            <input type="password" class="form-control" id="txtContra" maxlength="10" required>
        </div>
        <div class="d-flex justify-content-center align-items-center gap-2">
            <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
        </div>
    </form>
</main>
